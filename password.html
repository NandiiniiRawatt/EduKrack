<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Password</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1rem;
      display: flex;
      align-items: center;
    }

    .header img {
      height: 35px;
      width: auto;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 300px;
    }

    input {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
    }

    button {
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background-color: #10a37f;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0f8b6d;
    }
    
    .error-message {
      color: #e74c3c;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      display: none;
    }

    .password-requirements {
      text-align: left;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 1rem;
    }

    .password-requirements ul {
      margin-top: 0.5rem;
      padding-left: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo_icon.png" alt="EduKrack Icon" />
  </div>
  
  <h1>Create Your Password</h1>
  
  <div class="password-requirements">
    Your password should:
    <ul>
      <li>Be at least 8 characters long</li>
      <li>Include at least one uppercase letter</li>
      <li>Include at least one number</li>
    </ul>
  </div>
  
  <form id="passwordForm">
    <input type="password" id="password" placeholder="Enter password" required />
    <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
    <div class="error-message" id="errorMessage"></div>
    <button type="submit" id="submitButton">Submit</button>
  </form>

  <script>
    // Element references
    const form = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitButton = document.getElementById('submitButton');
    const errorMessage = document.getElementById('errorMessage');
    
    // Check if we're running on Live Server
    const isLiveServer = window.location.port === '5500' || 
                         window.location.port === '5501' || 
                         window.location.port === '5502';
    
    console.log("Live Server detection:", isLiveServer ? "Running on Live Server" : "Not on Live Server");
    
    // Function to show error message
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    // Function to clear error message
    function clearError() {
      errorMessage.textContent = '';
      errorMessage.style.display = 'none';
    }
    
    // Password validation function
    function validatePassword(password) {
      // At least 8 characters
      if (password.length < 8) {
        return 'Password must be at least 8 characters long';
      }
      
      // At least one uppercase letter
      if (!/[A-Z]/.test(password)) {
        return 'Password must include at least one uppercase letter';
      }
      
      // At least one number
      if (!/[0-9]/.test(password)) {
        return 'Password must include at least one number';
      }
      
      return null; // No error
    }

    document.getElementById('passwordForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      clearError();
      
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const email = localStorage.getItem('email'); // Retrieve email from localStorage
      
      // Show error immediately if we don't have an email
      if (!email) {
        showError('No email found. Please go back to the sign-up page.');
        setTimeout(() => {
          window.location.href = isLiveServer ? '/public/auth.html' : '/public/auth.html';
        }, 2000);
        return;
      }
      
      // Validate password
      const passwordError = validatePassword(password);
      if (passwordError) {
        showError(passwordError);
        return;
      }
      
      // Validate passwords match
      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }
      
      // Disable button and show loading state
      submitButton.disabled = true;
      submitButton.textContent = 'Creating account...';

      // Live Server mode - store password locally
      if (isLiveServer) {
        try {
          const username = localStorage.getItem('username');
          if (!username) {
            showError('Username not found. Please go back to the sign-up page.');
            return;
          }

          // Store the user data in local storage including username
          localStorage.setItem(`user_${email}`, JSON.stringify({
            email: email,
            username: username,
            password: password,
            created_at: new Date().toISOString()
          }));
          
          // Show success message
          alert('Account created successfully! Please log in with your email and password.');
          
          // Redirect to login page instead of automatically logging in
          localStorage.removeItem('authenticated');
          window.location.href = 'public/auth.html?login=true';
          return;
        } catch (error) {
          showError('Error creating account: ' + error.message);
          submitButton.disabled = false;
          submitButton.textContent = 'Submit';
        }
        return;
      }

      // Server-based authentication
      try {
        const response = await fetch('/api/create-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password, confirmPassword }),
        });

        const result = await response.json();
        
        if (!response.ok) {
          throw new Error(result.message || 'Error creating password');
        }

        if (result.success) {
          // Set authenticated status to true
          localStorage.setItem('authenticated', 'true');
          
          // Use server-provided redirect URL or fallback
          const redirectUrl = result.redirectTo || localStorage.getItem('redirectAfterLogin') || '/public/index.html';
          localStorage.removeItem('redirectAfterLogin'); // Clear saved redirect
          
          alert('Password created successfully! Redirecting to your destination.');
          window.location.href = redirectUrl;
        } else {
          throw new Error(result.message || 'Error creating password. Please try again.');
        }
      } catch (error) {
        showError(error.message || 'An unexpected error occurred');
        submitButton.disabled = false;
        submitButton.textContent = 'Submit';
      }
    });
    
    // Check if email is present, redirect if not
    document.addEventListener('DOMContentLoaded', function() {
      const email = localStorage.getItem('email');
      if (!email) {
        showError('Please complete sign-up first');
        setTimeout(() => {
          window.location.href = isLiveServer ? 'public/auth.html' : '/public/auth.html';
        }, 2000);
      }
      
      // If running on Live Server, add a notice at the top
      if (isLiveServer) {
        const noticeHTML = `
          <div style="background-color: #10a37f; color: white; padding: 10px; text-align: center; margin-bottom: 1.5rem; border-radius: 6px;">
            <strong>Live Server Mode:</strong> Creating local account. Password will be stored in browser storage.
          </div>
        `;
        form.insertAdjacentHTML('beforebegin', noticeHTML);
      }
    });
  </script>
</body>
</html>
